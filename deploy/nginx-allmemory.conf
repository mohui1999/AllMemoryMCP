# AllMemoryMCP reverse proxy — drop into host nginx (you already run nginx on the box).
# Mounts the service under /allmemory/ so it coexists with other sites on the same host.
# Assumes TLS is already terminated on the enclosing server block (e.g. via certbot).
# The container ports are published to 127.0.0.1 only, so nginx is the sole entry.

# NOTE: use `^~` on every prefix below. Many existing hosts have a
# `location ~* \.(js|css|...)$` block for static caching; plain prefix locations
# lose to that regex and /allmemory/assets/app.js would 404. `^~` stops the
# regex phase for these paths.
#
# REST API: /allmemory/api/* -> http://127.0.0.1:8099/*
location ^~ /allmemory/api/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass the Bearer token through untouched (never logged by default).
    proxy_set_header Authorization     $http_authorization;
    proxy_pass_request_headers on;
    client_max_body_size 1m;
}

# Read-only web viewer and its relative assets/API calls: /allmemory/* -> /*.
# Keep this after the more-specific REST and MCP locations above.
location = /allmemory {
    return 308 /allmemory/;
}
location ^~ /allmemory/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
}

# MCP Streamable HTTP: POST + GET(SSE). Keep connections long-lived.
location ^~ /allmemory/mcp {
    proxy_pass http://127.0.0.1:8001/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Accept-Encoding   "";
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    # Streamable HTTP may return SSE; flush promptly.
    proxy_buffering off;
}

