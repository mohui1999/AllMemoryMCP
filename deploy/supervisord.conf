[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid

[program:rest]
command=python -m uvicorn app:app --host 0.0.0.0 --port 8099
directory=/app
stdout_logfile=/var/log/supervisor/rest.out.log
stderr_logfile=/var/log/supervisor/rest.err.log
autorestart=true
startsecs=3
stopwaitsecs=10
environment=DATABASE_PATH="/data/memory.db"

[program:mcp]
command=python mcp_server.py
directory=/app
stdout_logfile=/var/log/supervisor/mcp.out.log
stderr_logfile=/var/log/supervisor/mcp.err.log
autorestart=true
startsecs=3
stopwaitsecs=10
environment=DATABASE_PATH="/data/memory.db"
